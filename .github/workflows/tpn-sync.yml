name: TPN manual batch

"on":
  workflow_dispatch:
    inputs:
      operation:
        description: Prepare a draft, apply reviewed decisions, or explicitly refresh the same PR
        required: true
        type: choice
        default: prepare
        options: [prepare, apply, refresh]
      pr_number:
        description: Existing TPN workflow PR number (apply/refresh only)
        required: false
        type: string
      expected_head:
        description: Exact reviewed 40-character HEAD SHA (apply/refresh only)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: tpn-sync
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare TPN batch with read permission
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
    outputs:
      outcome: ${{ steps.plan.outputs.outcome }}
    steps:
      - name: Checkout trusted main
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Sync trusted dependencies
        run: uv sync --frozen
      - name: Prepare complete snapshot and revision-bound decisions
        id: plan
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TPN_OPERATION: ${{ inputs.operation }}
          TPN_PR_NUMBER: ${{ inputs.pr_number }}
          TPN_EXPECTED_HEAD: ${{ inputs.expected_head }}
        run: uv run --frozen python scripts/run_tpn_sync.py plan --output build/tpn-transfer
      - name: Upload candidate for checked publication
        if: steps.plan.outputs.outcome == 'publish'
        uses: actions/upload-artifact@v4
        with:
          name: tpn-transfer-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/tpn-transfer/plan.json
            build/tpn-transfer/candidate.bundle
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish checked TPN draft or decision commit
    needs: prepare
    if: github.ref == 'refs/heads/main' && needs.prepare.outputs.outcome == 'publish'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout trusted main publisher
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Sync trusted dependencies
        run: uv sync --frozen
      - name: Download this run and attempt only
        uses: actions/download-artifact@v4
        with:
          name: tpn-transfer-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/tpn-transfer
      - name: Recheck main, HEAD, data, authorization and publish
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TPN_OPERATION: ${{ inputs.operation }}
          TPN_PR_NUMBER: ${{ inputs.pr_number }}
          TPN_EXPECTED_HEAD: ${{ inputs.expected_head }}
        run: uv run --frozen python scripts/run_tpn_sync.py publish --output build/tpn-transfer
