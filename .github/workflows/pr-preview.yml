name: PR export preview
run-name: "PR export preview #${{ github.event.pull_request.number }}"

"on":
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: pr-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview:
    name: Build PR export ZIP
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
      PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
    steps:
      - name: Checkout exact proposed merge
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Verify merge parents
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^1)" = "$PR_BASE_SHA"
          test "$(git rev-parse HEAD^2)" = "$PR_HEAD_SHA"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: false

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Build complete release exports and provenance
        run: >-
          uv run --frozen python scripts/build_pr_preview.py
          --output-dir build/pr-preview
          --repository "$GITHUB_REPOSITORY" --pr-number "$PR_NUMBER"
          --head-sha "$PR_HEAD_SHA" --base-sha "$PR_BASE_SHA"
          --merge-sha "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID"
          --run-attempt "$GITHUB_RUN_ATTEMPT"

      - name: Upload downloadable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: pr-preview-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}-${{ github.event.pull_request.base.sha }}-${{ github.sha }}-${{ github.run_attempt }}
          path: build/pr-preview/*
          if-no-files-found: error
          retention-days: 14
