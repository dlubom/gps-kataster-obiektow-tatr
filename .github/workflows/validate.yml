name: validate

"on":
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Validate code and data
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgis/postgis:18-3.6@sha256:4a43e3c3e5d55b9208240fc71db543b79c638766280c625a425bd0a2390989c4
        env:
          POSTGRES_PASSWORD: kataster-ci-only
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 2s --health-timeout 3s --health-retries 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up catalogue runtime
        uses: ./.github/actions/setup-runtime
        with:
          postgres-port: ${{ job.services.postgres.ports['5432'] }}
          postgres-container: ${{ job.services.postgres.id }}
          enable-uv-cache: "true"

      - name: Set up Node for publisher tests
        uses: actions/setup-node@v4
        with:
          node-version: "24.22.2"

      - name: Resolve accepted history baseline
        run: python scripts/ci_baseline.py

      - name: Check formatting
        run: uv run --frozen ruff format --check src tests scripts

      - name: Lint
        run: uv run --frozen ruff check src tests scripts

      - name: Test
        run: uv run --frozen pytest

      - name: Validate YAML catalogue and history
        run: uv run --frozen python scripts/validate.py --base-ref "$HISTORY_BASE_SHA"

      - name: Exercise managed Docker startup, dump, restore and cleanup
        env:
          KATASTER_DOCKER_SMOKE: "1"
        run: uv run --frozen pytest -q tests/test_postgres_runtime.py -k real_managed_docker
