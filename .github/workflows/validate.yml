name: validate

"on":
  pull_request:
  push:
    branches:
      - main
      - codex/review-remediation

permissions:
  contents: read

jobs:
  validate:
    name: Validate code and data
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Verify code, data and generated artifacts
        run: uv run --frozen python scripts/verify_project.py
