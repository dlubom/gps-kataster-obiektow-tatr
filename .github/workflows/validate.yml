name: validate

"on":
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Validate code and data
    runs-on: ubuntu-latest
    env:
      KATASTER_HISTORY_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node for publisher tests
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Check generated schemas
        run: uv run --frozen python scripts/generate_schemas.py --check

      - name: Check formatting
        run: uv run --frozen ruff format --check src tests scripts

      - name: Lint
        run: uv run --frozen ruff check src tests scripts

      - name: Test
        run: uv run --frozen pytest

      - name: Validate YAML data
        run: uv run --frozen python scripts/validate.py
