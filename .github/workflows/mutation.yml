name: mutation

"on":
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mutation:
    name: Mutation tests
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgis/postgis:18-3.6@sha256:4a43e3c3e5d55b9208240fc71db543b79c638766280c625a425bd0a2390989c4
        env:
          POSTGRES_PASSWORD: kataster-ci-only
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 2s --health-timeout 3s --health-retries 30
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up catalogue runtime
        uses: ./.github/actions/setup-runtime
        with:
          postgres-port: ${{ job.services.postgres.ports['5432'] }}
          postgres-container: ${{ job.services.postgres.id }}
          enable-uv-cache: "true"

      - name: Set up Node for publisher tests
        uses: actions/setup-node@v4
        with:
          node-version: "24.22.2"

      - name: Resolve accepted history baseline
        run: python scripts/ci_baseline.py

      - name: Baseline tests
        run: uv run --frozen pytest

      - name: Run mutation tests
        run: uv run --frozen mutmut run --max-children 2

      - name: Export mutation stats
        if: always()
        run: uv run --frozen mutmut export-cicd-stats

      - name: Upload mutation stats
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutmut-cicd-stats
          path: mutants/mutmut-cicd-stats.json
          if-no-files-found: warn
