name: release

"on":
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Publish GitHub Release
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgis/postgis:18-3.6@sha256:4a43e3c3e5d55b9208240fc71db543b79c638766280c625a425bd0a2390989c4
        env:
          POSTGRES_PASSWORD: kataster-ci-only
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 2s --health-timeout 3s --health-retries 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Set up catalogue runtime
        uses: ./.github/actions/setup-runtime
        with:
          postgres-port: ${{ job.services.postgres.ports['5432'] }}
          postgres-container: ${{ job.services.postgres.id }}
          enable-uv-cache: "true"

      - name: Resolve accepted history baseline
        run: python scripts/ci_baseline.py

      - name: Validate YAML catalogue and history
        run: uv run --frozen python scripts/validate.py --base-ref "$HISTORY_BASE_SHA"

      - name: Build release artifacts
        run: |
          mkdir -p build
          if ! uv run --frozen python scripts/build_release_artifacts.py \
            --release-version "$GITHUB_REF_NAME" --source-commit "$GITHUB_SHA" \
            --base-ref "$HISTORY_BASE_SHA" --artifact-list > build/release-artifacts.list; then
            cat build/release-artifacts.list
            exit 1
          fi

      - name: Extract release notes from CHANGELOG.md
        run: |
          awk '/^## \['"${{ steps.version.outputs.VERSION }}"'\]/{found=1; next} found && /^## \[/{exit} found{print}' CHANGELOG.md > release_notes.md
          if [ ! -s release_notes.md ]; then
            echo "No CHANGELOG.md entry found for ${{ steps.version.outputs.VERSION }}."
            exit 1
          fi
          printf '\n' >> release_notes.md
          cat build/exports/statistics.md >> release_notes.md

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          artifacts=()
          while IFS= read -r -d '' artifact; do
            artifacts+=("$artifact")
          done < build/release-artifacts.list
          gh release create "${{ steps.version.outputs.VERSION }}" "${artifacts[@]}" \
            --title "${{ steps.version.outputs.VERSION }}" \
            --notes-file release_notes.md
