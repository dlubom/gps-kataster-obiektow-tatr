name: release

"on":
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync

      - name: Validate YAML data
        run: uv run python scripts/validate.py

      - name: Resolve latest stable JKTZ once
        # Resolve the external input once; builders and native checks then stay offline.
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run python scripts/fetch_jktz_release.py --output-dir build/inputs/jktz

      - name: Build release artifacts from local inputs
        run: >-
          uv run python scripts/build_release_artifacts.py
          --release-version "$GITHUB_REF_NAME" --source-commit "$GITHUB_SHA"
          --jktz-source-dir build/inputs/jktz

      - name: Check relocated package in QGIS 3.44 LTR and 4.0.1 offline
        run: >-
          bash scripts/check_qgis_containers.sh
          build/exports/katalog-qgis.zip build/exports/katalog.sqlite.zip build/inputs/jktz

      - name: Extract release notes from CHANGELOG.md
        run: |
          awk '/^## \['"${{ steps.version.outputs.VERSION }}"'\]/{found=1; next} found && /^## \[/{exit} found{print}' CHANGELOG.md > release_notes.md
          if [ ! -s release_notes.md ]; then
            echo "No CHANGELOG.md entry found for ${{ steps.version.outputs.VERSION }}."
            exit 1
          fi
          printf '\n' >> release_notes.md
          cat build/exports/statistics.md >> release_notes.md

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.version.outputs.VERSION }}" \
            build/exports/best-measurements.geojson \
            build/exports/best-measurements.csv \
            build/exports/best-measurements.gpx \
            build/exports/chocholowska-lejowa-koscieliska.gpx \
            build/exports/mietusia-sucha-woda.gpx \
            build/exports/pozostale-pl-sk.gpx \
            build/exports/best-measurements.shp.zip \
            build/exports/katalog.sqlite.zip \
            build/exports/metadata.json \
            build/exports/statistics.json \
            build/exports/statistics.md \
            build/exports/katalog.xlsx \
            build/exports/katalog-qgis.zip \
            --title "${{ steps.version.outputs.VERSION }}" \
            --notes-file release_notes.md
