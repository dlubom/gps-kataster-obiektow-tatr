  Okno przy Źródle figuruje pod tą samą nazwą w zestawieniu Jakuba Nowaka „Jaskinie Tatr”, KKTJ, załącznik „04 Dolinki Reglowe 2026.07”, s. 3, Dolina Białego, lp. 4. Długość 3 m, deniwelacja i przewyższenie 1,2 m są zgodne z danymi TPN. Wykaz potwierdza nazwę i metryki jaskini; nie potwierdza dokładnych współrzędnych otworu.

  Dane TPN (stan rekordu 2026-05-09, zrzut 2026-10-22): długość 3 m; przewyższenie 1,2 m; deniwelacja 1,2 m. Źródło: https://gis.tpn.pl/server/rest/services/Topografia___wektor_MIL1/MapServer/6; GLOBALID {6EBD9C00-D272-4909-85EC-00AE2BB6632D}, OBJECTID 6402.

