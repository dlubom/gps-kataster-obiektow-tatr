  Jaskinia w Olejarni przy Wyżniej Bramie Chochołowskiej, odrębna od Zbójeckiej Dziury. Długość 6,5 m. Nowak (2018, 2026) podaje 2 m deniwelacji; TPN zapisuje 2 m przewyższenia i nie podaje deniwelacji. Znak różnicy wysokości pozostaje niepotwierdzony.

