notes: |-
  Rurę w Olejarni opisuje Jakub Nowak w „Dwóch jaskiniach w Olejarni” („Jaskinie” 93, 2018, s. 32). Nazwę wymienia także zestawienie KKTJ „03 Dol. Chochołowska 2026.07”, s. 3, lp. 72. Zgodne są nazwa i długość 6,5 m; opis dotyczy Olejarni przy Wyżniej Bramie Chochołowskiej. Artykuł i wykaz podają 2 m jako deniwelację, natomiast TPN zapisuje 2 m w polu przewyższenia i nie podaje deniwelacji. Te zapisy nie potwierdzają niezależnie znaku różnicy wysokości. Rura jest odrębna od Zbójeckiej Dziury.

  Dane TPN (stan rekordu 2026-06-16, zrzut 2026-10-22): długość 6,5 m; przewyższenie 2 m. Źródło: https://gis.tpn.pl/server/rest/services/Topografia___wektor_MIL1/MapServer/6; GLOBALID {D96CD642-E9D3-4EB8-B9DC-D7DF3F449705}, OBJECTID 7368.

  Geneza w TPN: jaskinia.
