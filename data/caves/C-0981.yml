notes: 'Wspólny rekord otworów N (MLW-0044, wcześniej C-0947) i S (MLW-0050).
  Oznaczenia otworów pochodzą z archiwum TPN, arkusz Export, wiersze 612 i 874.
  Arkusz podaje zera dla N oraz 10 m długości, 0 m głębokości i 2 m
  deniwelacji dla S. Geoportal TATRY (odczyt 2026-11-07, OBJECTID 5782 i 5781)
  potwierdza oznaczenia N i S oraz wymiary 10 m i 2 m dla S. W API obie
  głębokości są puste.
  Weryfikacja lokalizacji S w TPN: 15-11-2024 FF, orto.

  KKTJ 2026-07, PDF 04, s. 2, lp. 28 podaje 10,1 m długości i 2,5 m
  deniwelacji przy wysokości 1648 m n.p.m.

  Odległość przestrzenna między punktami TPN N i S wynosi 11,59 m.

  Filar 2026 (s. 37) podaje 1648 m n.p.m. bez osobnych wysokości otworów.
  Plan z 2024 r. pokazuje dwa połączone otwory. W TPN otwór N
  (MLW-0044, m-001) ma 1658,48 m, a otwór S (MLW-0050, m-001) ma
  1649,74 m. Różnica 8,75 m przekracza deniwelację opublikowaną dla
  całego tunelu. Odroczony punkt TPN 6721 leży w poziomie ok. 2,2 m od
  punktu S i 8,3 m od N. Identyfikacja punktu pozostaje otwarta.'
