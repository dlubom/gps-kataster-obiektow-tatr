notes: 'TPN verification/location note: 17-05-2025 FF NMT

  Filar 2026 (s. 38) podaje 1502 m n.p.m. dla nienumerowanej nyży.
  Dla STR-0028 starszy rekord TPN (m-001) podaje 1501,89 m, a nowszy
  m-002 ma 1510,34 m z NMT TPN, czyli wysokość gruntu. Artykuł z nr 124–125
  rozróżnia ją od Nyży II i zachowuje dla niej nazwę bez numeru.'
