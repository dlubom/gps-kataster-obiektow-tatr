notes: |-
  Sylwia Solarczyk opisała „Jaskinię Cynamonową” w „Jaskiniach” 101 (2020), s. 33–34, z planem i współrzędnymi otworu. Nazwa, długość 47 m, deniwelacja 13,7 m, głębokość 11,9 m i przewyższenie 1,8 m są zgodne z TPN. Nazwę wymienia także zestawienie Jakuba Nowaka/KKTJ „03 Dol. Chochołowska 2026.07”, s. 3, lp. 84; podaje ono jednak głębokość 11,3 m, odmienną od artykułu i TPN.

  Dane TPN (stan rekordu 2026-06-16, zrzut 2026-10-22): długość 47 m; głębokość 11,9 m; przewyższenie 1,8 m; deniwelacja 13,7 m. Źródło: https://gis.tpn.pl/server/rest/services/Topografia___wektor_MIL1/MapServer/6; GLOBALID {A876A547-7912-4033-BB3F-8ED2F589C5F0}, OBJECTID 7367.

  Geneza w TPN: jaskinia.
