notes: |-
  Okno pod Sikawką opisuje Jakub Nowak w „Z archiwum «J» cz. VII – Sikawka” („Jaskinie” 73, 2013, s. 27–28), oddzielnie od Jaskini przy Sikawce. Nazwa występuje również w zestawieniu KKTJ „05 Dol. Kościeliska 2026.07”, s. 7, lp. 196. Nazwa, długość 3,5 m i opis położenia przy wodospadzie Sikawka w Żlebie pod Wysranki odpowiadają rekordowi TPN. Literatura podaje ponadto 1 m deniwelacji, a wykaz 1 m przewyższenia; odpowiednie pola TPN są puste.

  Dane TPN (stan rekordu 2026-06-02, zrzut 2026-10-22): długość 3,5 m. Źródło: https://gis.tpn.pl/server/rest/services/Topografia___wektor_MIL1/MapServer/6; GLOBALID {EF966744-EB95-48B3-B2BA-7A031F8DF91A}, OBJECTID 7378.

  Geneza w TPN: jaskinia.
