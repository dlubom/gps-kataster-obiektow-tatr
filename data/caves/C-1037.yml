notes: |-
  Jakub Nowak w artykule „Korytarz pod Ciemniakiem” („Jaskinie” 77, 2014, s. 29) opisuje jednootworowe, ślepe schronisko w Dolinie Mułowej, w ścianie Ciemniaka. Ta sama nazwa występuje w załączniku „08 Dol. Miętusia 2026.07” do zestawienia Nowaka na stronie KKTJ, s. 2, lp. 62. Nazwa, długość 8 m i przewyższenie 1,3 m są zgodne z rekordem TPN 7044. Wariant „Korytarz w Ciemniaku” pochodzi z drugiego rekordu TPN 6408; nie występuje w tych źródłach literaturowych. Powiązanie obu zapisów TPN z jednym obiektem jest interpretacją danych źródłowych, nie stwierdzonym w publikacji synonimem.

  Dane TPN (stan rekordu 2026-06-16, zrzut 2026-10-22): długość 8 m; przewyższenie 1,3 m. Źródło: https://gis.tpn.pl/server/rest/services/Topografia___wektor_MIL1/MapServer/6; GLOBALID {8E246480-F366-4D0F-BA7E-A601E865FD03}, OBJECTID 7044.

  Geneza w TPN: jaskinia.
