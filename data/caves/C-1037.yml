notes: |-
  Dodano po przeglądzie tożsamości według PBI-113, na podstawie rekordu TPN; bez numeru inwentarzowego i bez niezależnej weryfikacji terenowej.

  Źródło: https://gis.tpn.pl/server/rest/services/Topografia___wektor_MIL1/MapServer/6; GLOBALID {8E246480-F366-4D0F-BA7E-A601E865FD03}; OBJECTID 7044 w zrzucie 2026-10-22.

  TPN morfometria [m]: DLUGOSC=8.0; PRZEWYZSZE=1.3. Wartości źródłowe, bez ponownej interpretacji.

  TPN GENEZA: jaskinia.

  Jeden Obiekt z dwoma rekordami TPN na podstawie zaakceptowanej interpretacji: Nowak 2014, Jaskinie 77, s. 29 opisuje jeden otwór ślepego schroniska 8 m/+1,3 m (http://jaskinie.org.pl/files/Jaskinie__77_2014.pdf#page=29). Rekord 7044 odpowiada nazwie i metrykom publikacji; nieuzupełniony rekord 6408 ten sam autor utworzył 12 sekund wcześniej, a punkty różnią się o około 0,097 m. Sama bliskość nie jest podstawą utożsamienia. TPN 6408 zachowuje źródłową nazwę Korytarz w Ciemniaku i własny pomiar; oba punkty oraz NMT pozostają bez uśredniania. Pełniejszy opis nie dowodzi większej dokładności XY.
