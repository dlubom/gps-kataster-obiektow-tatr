  notes: 'Pozycja z sieci pomiarowej jaskini: stacja Pawlikowskiego:Raptawicka:1.0, wynik
    sieci systemu Pawlikowskiego obejmującej pomiary jaskiń i ciąg powierzchniowy Obłazkowa–Raptawicka.
    Kotwica sieci: Pawlikowskiego:Mylna:0, pierwotna metoda wyznaczenia kotwicy niepotwierdzona.
    Historyczny wynik UTM 34N: E 417181.04, N 5454744.17, H 1141.31 m. Źródło pozycji: historyczna
    sieć JKTZ, rewizja 773c8e2e6aa910c8ba78192ae6741d107c6598e2 sprzed wydzielenia wspólnego
    pliku otworów w 6561bab3bdcd37f607820a4a1f0373147b63572e. Odtworzenie kompilacji Survex
    1.4.24 tej rewizji oraz przeliczenie EPSG:32634 do WGS84 potwierdziło zgodność pozycji
    i wysokości z obecnymi wartościami, do zapisanej precyzji. Korekta pochodzenia 2026-10-23
    usuwa błędną klasyfikację bezpośredniego GNSS z importu GPS b83dede4bf36ccbf87e9e3dbf97e5c6493c2de14.
    observed_date 2026-05-16 zachowano jako dotychczasową datę zapisu punktu w GPS; nie potwierdza
    daty pomiarów terenowych. Datum wysokości i dokładności pozostają nieznane; status weryfikacji
    bez zmian. Źródła: https://github.com/dlubom/Jaskiniowy-Kataster-Tatr-Zachodnich/blob/773c8e2e6aa910c8ba78192ae6741d107c6598e2/Poligony/D_Koscieliska/Kom_Wierch/Rapt_Turnia/Syst_Pawlikowskiego/Powierzchnia/POW_ORM.SRV,
