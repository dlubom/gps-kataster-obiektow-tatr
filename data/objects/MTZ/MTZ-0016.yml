    Sprzęt: DistoX id 4027. Źródło otrzymane 2026-11-16: Zestawienie wiersz 19, Report wiersz 502. observed_date
    zachowuje datę 2025-11-10 z Zestawienia i obliczenia deklinacji. Obserwacje kotwicy GNSS w Report
    są datowane 2024-07-20; źródło nie podaje odrębnej daty terenowego domiaru. Przyjęty do Best przez
    Dariusza Lubomskiego 2026-11-16. Kontrola rachunkowa źródła nie jest nową weryfikacją terenową; status
    pozostaje nieweryfikowany. Deklaracja źródła: dokładność GNSS < 0,20 m; nie określa osobno dokładności
    poziomej i pionowej końcowego punktu otworu. Obie dokładności pozostają nieznane.'
