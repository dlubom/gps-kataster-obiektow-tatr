  notes: 'Otwór domierzony od punktu GNSS; długość domiaru 1.48 m. Poprawny znak: azymut PL-1992 = azymut
    magnetyczny + (deklinacja - zbieżność południków). Obliczył Marek Jędrzejczak (Speleoclub Wrocław).
    Pomiary; Zespół: Stanisław Mielczarek, Agnieszka Samborska, Jan Grzeszek (Speleoklub Warszawski);
    Sprzęt: DistoX id 4027. Źródło otrzymane 2026-11-16: Zestawienie wiersz 20, Report wiersz 527. observed_date
    zachowuje datę 2025-11-10 z Zestawienia i obliczenia deklinacji. Obserwacje kotwicy GNSS w Report
    są datowane 2024-07-20; źródło nie podaje odrębnej daty terenowego domiaru. GNSS metodą statyczną
    przy braku zasięgu, w bardzo słabych warunkach; duże błędy po wyrównaniu. Według autora wynik tylko
    potwierdza dotychczasową lokalizację. Decyzją Dariusza Lubomskiego z 2026-11-16 zachowano dotychczasowy
    Best m-002. W Report wiersz 521 błędnie opisano kotwicę jako MW1; jej współrzędne odpowiadają M2 z
    wiersza 509. Deklaracja źródła: dokładność GNSS < 3,80 m; nie określa osobno dokładności poziomej
    i pionowej końcowego punktu otworu. Obie dokładności pozostają nieznane.'
