  Nazwy według PIG: Dziura w Grzędzie I (T.E-12.14, PIG:1549) i II (T.E-12.13, PIG:1548). Raport Marka
  Jędrzejczaka przypisuje punkt I do MTW-0050, a II do MTW-0016; te przypisania zachowano. Nowy punkt
